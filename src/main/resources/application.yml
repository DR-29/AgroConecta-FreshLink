server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:freshlink}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: ${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: "FreshLinkSecretKey2024MustBeAtLeast256BitsLongForHS256Algorithm"
    expiration-ms: 86400000
